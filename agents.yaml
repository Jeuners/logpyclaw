agents:

  - type: echo
    id: agent:echo
    name: Echo

  - type: llm
    id: agent:alice
    name: Alice
    model: "qwen3.5:latest"
    provider: ollama
    ollama_url: "http://localhost:11434"   # gemeinsames lokales Modell auf diesem Mac
    soul: ""           # leer → i18n default
    faction: makers
    enabled: true
    temperature: 0.7
    max_tokens: 2048

  - type: martin
    model: "qwen3.5:latest"
    provider: ollama
    ollama_url: "http://localhost:11434"   # lokales Ollama
    temperature: 0.3   # niedrig → präzise Routing-Entscheidungen
    persona: |
      Du bist Martin, der persönliche Assistent des Nutzers. Du bist hilfsbereit,
      direkt und sprichst per Du auf Deutsch. Du hast ein semantisches
      Langzeit-Gedächtnis: relevante Erinnerungen über den Nutzer und seine
      Projekte (z. B. LogpyClaw) werden dir pro Nachricht eingeblendet — nutze
      sie, statt zu raten. Du verfügst über ein Team von Spezialisten, an die du
      konkrete Werkzeug-Aufgaben delegierst — Fragen über dich, Smalltalk und
      allgemeine Wissensfragen beantwortest du selbst, knapp und persönlich.
    qc:
      enabled: true
      min_score: 7
      max_retries: 2
      auditor_id: "agent:alice"  # Alice (qwen3.5 lokal) für QC ohne externe API

  - type: skill
    skill_id: websearch
    enabled: true

  - type: skill
    skill_id: comfyui
    enabled: true
    config:
      endpoint: "http://127.0.0.1:8000"   # ComfyUI — leer fällt auf cfg.comfyui_url zurück

  - type: skill
    skill_id: krea2_turbo
    enabled: false   # persönliches Experiment, standardmäßig aus
    config:
      endpoint: "http://127.0.0.1:8000"   # krea2_turbo + darkbrush-LoRA, Pre-Check inklusive

  - type: skill
    skill_id: ltxvideo
    enabled: true
    config:
      endpoint: "http://127.0.0.1:8000"   # ComfyUI — leer fällt auf cfg.comfyui_url zurück

  - type: skill
    skill_id: upscale
    enabled: true
    config:
      endpoint: "http://127.0.0.1:8000"   # ComfyUI — leer fällt auf cfg.comfyui_url zurück


  - type: llm
    id: agent:coder
    name: Coder
    model: "qwen3:8b"
    provider: ollama
    ollama_url: "http://127.0.0.1:11434"   # lokales Ollama
    soul: "Du bist ein Experten-Programmierer. Schreibe sauberen, effizienten Code. Erkläre kurz was du tust. Nutze Codeblöcke."
    faction: makers
    enabled: true
    temperature: 0.15
    max_tokens: 32768   # komplette Single-File-Spiele brauchen Platz — 4096 schnitt Builds ab

  - type: llm
    id: agent:local
    name: Local
    model: "llama3.2:3b"
    provider: ollama
    ollama_url: "http://localhost:11434"
    soul: "Du bist ein hilfreicher Assistent. Antworte präzise und nutze Tool-Aufrufe wenn sinnvoll."
    faction: makers
    enabled: true
    temperature: 0.7
    max_tokens: 2048

  - type: llm
    id: agent:router
    name: Router
    model: "gemma3:12b"   # Ollama
    provider: ollama
    ollama_url: "http://localhost:11434"
    soul: "Du bist ein hilfreicher Assistent. Antworte präzise und nutze Tool-Aufrufe wenn sinnvoll."
    faction: makers
    enabled: true
    temperature: 0.7
    max_tokens: 2048

  - type: skill
    skill_id: coding
    enabled: false   # persönliches Experiment, standardmäßig aus

  - type: skill
    skill_id: gmail
    enabled: false   # persönliches Experiment, standardmäßig aus

  - type: skill
    skill_id: browser
    enabled: true

  - type: skill
    skill_id: chrome_browser
    enabled: false   # persönliches Experiment, standardmäßig aus

  - type: skill
    skill_id: deploy
    enabled: false   # persönliches Experiment, standardmäßig aus

  - type: skill
    skill_id: urlfetch
    enabled: true

  - type: skill
    skill_id: file
    enabled: false   # persönliches Experiment, standardmäßig aus

  - type: skill
    skill_id: memory
    enabled: true

  - type: skill
    skill_id: rss
    enabled: true

  - type: skill
    skill_id: linkedin
    enabled: false   # persönliches Experiment, standardmäßig aus
    config:
      access_token: ""   # LINKEDIN_ACCESS_TOKEN
      client_id: ""      # LINKEDIN_CLIENT_ID
      client_secret: ""  # LINKEDIN_CLIENT_SECRET → für Token-Introspection (Member-URN auto)
      person_urn: ""     # LINKEDIN_PERSON_URN (alternativ: direkte numerische ID)

  - type: skill
    skill_id: telegram
    enabled: false   # persönliches Experiment, standardmäßig aus
    config:
      token: ""     # TELEGRAM_BOT_TOKEN
      chat_id: ""   # TELEGRAM_CHAT_ID

  - type: skill
    skill_id: wikipedia
    enabled: true

  - type: skill
    skill_id: physorg
    enabled: true

  - type: skill
    skill_id: youtube
    enabled: false   # persönliches Experiment, standardmäßig aus

  - type: skill
    skill_id: transcription
    enabled: true
    config:
      whisper_model: "${HOME}/whisper-models/ggml-large-v3-turbo.bin"   # lokales whisper.cpp ggml-Modell
      whisper_cli: "/opt/homebrew/bin/whisper-cli"                      # whisper.cpp CLI (brew)
      ollama_url: "http://localhost:11434"                             # nur Fallback

  - type: claude
    id: agent:claude
    name: Claude
    faction: makers
    enabled: false   # optional: nutzt die Claude-Cloud, standardmäßig aus
    claude_bin: "${HOME}/.local/bin/claude"
    model: "claude-opus-4-8"
    goal: "Du bist ein Experten-Entwickler und kreativer Designer. Liefere ausschließlich vollständige, lauffähige, produktionsreife Ergebnisse."
    timeout: 600   # 10min — reicht für komplette HTML-Builds (~1500+ Zeilen)

  - type: a2a_gateway
    default_recipient: agent:alice
